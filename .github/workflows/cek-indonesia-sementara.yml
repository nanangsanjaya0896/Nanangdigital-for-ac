# Workflow SEMENTARA: membuka nanangdigital.web.id dari jaringan internet di Indonesia
# lewat layanan publik Globalping (api.globalping.io), lalu mencatat hasilnya sebagai anotasi.
# File ini dihapus lagi setelah pengecekan selesai.
name: Cek dari Indonesia (sementara)

on:
  push:
    branches: [arena/1c1a9eaf-nanangdigital-for-ac]
    paths: [.github/workflows/cek-indonesia-sementara.yml]

permissions:
  contents: read

jobs:
  cek:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Uji dari Indonesia lewat Globalping
        run: |
          python3 - <<'PY'
          import json
          import time
          import urllib.request

          API = "https://api.globalping.io/v1/measurements"

          def notice(title, text):
              text = text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::notice title={title}::{text}")

          def buat(body):
              req = urllib.request.Request(API, data=json.dumps(body).encode(), headers={"Content-Type": "application/json"}, method="POST")
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.load(r)["id"]

          def tunggu(mid):
              for _ in range(40):
                  with urllib.request.urlopen(f"{API}/{mid}", timeout=30) as r:
                      data = json.load(r)
                  if data.get("status") != "in-progress":
                      return data
                  time.sleep(2)
              return data

          lokasi = [{"country": "ID", "limit": 6}]
          uji = {
              "HTTPS beranda": {"type": "http", "target": "nanangdigital.web.id", "locations": lokasi,
                                 "measurementOptions": {"protocol": "HTTPS", "request": {"method": "GET", "path": "/"}}},
              "HTTP beranda": {"type": "http", "target": "nanangdigital.web.id", "locations": lokasi,
                                "measurementOptions": {"protocol": "HTTP", "request": {"method": "GET", "path": "/"}}},
              "DNS A": {"type": "dns", "target": "nanangdigital.web.id", "locations": lokasi,
                        "measurementOptions": {"query": {"type": "A"}}},
          }
          for judul, body in uji.items():
              try:
                  data = tunggu(buat(body))
              except Exception as exc:
                  notice(judul, f"gagal memanggil Globalping: {exc}")
                  continue
              baris = []
              for item in data.get("results", []):
                  p = item.get("probe", {})
                  res = item.get("result", {})
                  asal = f"{p.get('city')} | {p.get('network')} (AS{p.get('asn')})"
                  if body["type"] == "http":
                      h = {k.lower(): v for k, v in (res.get("headers") or {}).items()}
                      isi = (res.get("rawBody") or "")[:60].replace("\n", " ")
                      baris.append(
                          f"{asal}: status {res.get('statusCode')} | {h.get('content-type')} | location {h.get('location')} "
                          f"| cf-ray {h.get('cf-ray')} | awal isi: {isi!r} | {res.get('status')}"
                      )
                  else:
                      jawab = [a.get("value") for a in (res.get("answers") or [])]
                      baris.append(f"{asal}: resolver {res.get('resolver')} -> {jawab} | {res.get('status')}")
              notice(judul, "\n".join(baris) or json.dumps(data)[:1500])
          PY
