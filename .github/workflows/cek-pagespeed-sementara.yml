# SEMENTARA: ukur skor PageSpeed (Lighthouse) website live dan preview branch. Akan dihapus lagi.
name: Cek PageSpeed (sementara)

on:
  push:
    branches: [arena/24a34400-nanangdigital-for-ac]
    paths:
      - cek-pagespeed/urls.txt
      - .github/workflows/cek-pagespeed-sementara.yml
  workflow_dispatch:

permissions:
  contents: write
  checks: read

concurrency:
  group: cek-pagespeed-sementara
  cancel-in-progress: true

jobs:
  ukur:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Pasang Lighthouse
        run: npm i -g lighthouse@13.6.0

      - name: Tunggu build preview Cloudflare untuk commit ini selesai
        if: ${{ hashFiles('cek-pagespeed/urls.txt') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! grep -q "arena-24a34400" cek-pagespeed/urls.txt; then exit 0; fi
          for i in $(seq 1 40); do
            st=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs" --jq '[.check_runs[] | select(.name | startswith("Workers Builds")) | .status + ":" + (.conclusion // "-")] | join(",")' || true)
            echo "percobaan $i: $st"
            case "$st" in *completed*) break;; esac
            sleep 15
          done
          sleep 20

      - name: Cek script yang disisipkan di HTML live
        run: |
          for u in https://nanangdigital.web.id/ https://nanangdigital-for-ac.wong-moghey.workers.dev/; do
            echo "== $u"
            curl -sS -D /tmp/h.txt -o /tmp/p.html -H 'Accept-Encoding: br, gzip' --compressed "$u"
            grep -iE '^(content-encoding|cache-control|server|cf-cache-status|alt-svc|content-length):' /tmp/h.txt || true
            grep -oE '<script[^>]*src="[^"]*"[^>]*>' /tmp/p.html | head -20
            grep -c 'cloudflareinsights\|cf-beacon\|email-decode\|rocket-loader' /tmp/p.html || true
            wc -c /tmp/p.html
          done

      - name: Jalankan Lighthouse
        run: node cek-pagespeed/run.mjs

      - name: Simpan hasil ke branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cek-pagespeed/hasil.md
          git commit -m "Sementara: hasil cek PageSpeed" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
