# SEMENTARA: lihat rincian skor PageSpeed Insights (desktop) dan ukur ulang dengan Lighthouse. Akan dihapus lagi.
name: Cek PageSpeed (sementara)

on:
  push:
    branches: [arena/ded5308d-nanangdigital-for-ac]
    paths:
      - cek-pagespeed/urls.txt
      - cek-pagespeed/globalping.mjs
      - .github/workflows/cek-pagespeed-sementara.yml
  workflow_dispatch:

permissions:
  contents: write
  checks: read

concurrency:
  group: cek-pagespeed-sementara
  cancel-in-progress: true

jobs:
  ukur:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Pasang Lighthouse
        run: npm i -g lighthouse@13.6.0

      - name: Tunggu build preview Cloudflare untuk commit ini selesai
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 40); do
            st=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs" --jq '[.check_runs[] | select(.name | startswith("Workers Builds")) | .status + ":" + (.conclusion // "-")] | join(",")' || true)
            echo "percobaan $i: $st"
            case "$st" in *completed*) break;; esac
            sleep 15
          done
          sleep 20

      - name: Ukur waktu respons dari berbagai negara (Globalping)
        continue-on-error: true
        env:
          OUT_DIR: ${{ github.workspace }}/cek-pagespeed
          TARGET_HOST: arena-ded5308d-nanangdigital-for-ac-nanangdigital-for-ac.wong-moghey.workers.dev
          PATHS: /,/panduan/
          ROUNDS: "2"
        run: timeout 600 node cek-pagespeed/globalping.mjs

      - name: Jalankan Lighthouse
        run: node cek-pagespeed/run.mjs

      - name: Simpan hasil ke branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cek-pagespeed/hasil.md cek-pagespeed/globalping.md 2>/dev/null || true
          git commit -m "Sementara: hasil cek PageSpeed" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
