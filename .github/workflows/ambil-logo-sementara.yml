# SEMENTARA: unduh logo dari Cloudinary untuk dibuat favicon. Akan dihapus lagi. (percobaan 2)
name: Ambil logo (sementara)

on:
  push:
    branches: [arena/5d9b0b6e-nanangdigital-for-ac]
    paths:
      - .github/workflows/ambil-logo-sementara.yml

permissions:
  contents: write

jobs:
  ambil:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Unduh logo dan foto
        run: |
          mkdir -p cek-logo
          curl -sSL -o cek-logo/logo-asli.jpg "https://res.cloudinary.com/col2kwnv/image/upload/Logo_Nanang_Digital.jpg"
          curl -sSL -o cek-logo/logo.png "https://res.cloudinary.com/col2kwnv/image/upload/f_png/Logo_Nanang_Digital.jpg"
          curl -sSL -o cek-logo/logo-512.png "https://res.cloudinary.com/col2kwnv/image/upload/f_png,w_512,h_512,c_pad,b_rgb:0d1116/Logo_Nanang_Digital.jpg"
          file cek-logo/* || true
          ls -la cek-logo
          for f in cek-logo/*; do echo "::notice::$(file -b "$f" | cut -c1-120) | $(stat -c %s "$f") byte | $f"; done
          python3 -c "
          import struct,sys
          for f in ['cek-logo/logo.png','cek-logo/logo-512.png']:
              d=open(f,'rb').read(24)
              print(f, struct.unpack('>II', d[16:24]) if d[:8]==b'\x89PNG\r\n\x1a\n' else 'bukan png')
          "
      - name: Simpan ke branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f cek-logo
          git status --short | head -5
          echo "::notice::status: $(git status --short | tr '\n' ' ')"
          git commit -m "Sementara: logo dari Cloudinary" || { echo "::notice::tidak ada yang di-commit"; exit 0; }
          git push 2>&1 | tail -3 && echo "::notice::push selesai"
