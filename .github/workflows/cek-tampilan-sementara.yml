# Workflow SEMENTARA: membuka nanangdigital.web.id dengan Chrome sungguhan (tanpa login, halaman publik),
# mencatat error JavaScript, lalu menyimpan screenshot ke folder cek-tampilan/ di branch ini.
# File ini dan folder hasilnya dihapus lagi setelah pengecekan selesai.
name: Cek tampilan (sementara)

on:
  push:
    branches: [arena/1c1a9eaf-nanangdigital-for-ac]
    paths: [.github/workflows/cek-tampilan-sementara.yml]

permissions:
  contents: write

jobs:
  cek:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Siapkan Chrome
        run: |
          npm i --prefix /tmp/pp puppeteer-core@24 @puppeteer/browsers@2 --no-audit --no-fund --loglevel=error
          if command -v google-chrome >/dev/null; then
            echo "CHROME=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            P=$(cd /tmp/pp && npx @puppeteer/browsers install chrome@stable --path /tmp/chrome | tail -1 | awk '{print $2}')
            echo "CHROME=$P" >> "$GITHUB_ENV"
          fi

      - name: Buka website dan ambil screenshot
        run: |
          mkdir -p cek-tampilan
          cat > /tmp/pp/cek.mjs <<'JS'
          import puppeteer from "puppeteer-core";
          import fs from "node:fs";

          const browser = await puppeteer.launch({
            executablePath: process.env.CHROME,
            args: ["--no-sandbox", "--disable-dev-shm-usage"],
          });
          const hp = {
            viewport: { width: 390, height: 844, deviceScaleFactor: 1, isMobile: true, hasTouch: true },
            userAgent: "Mozilla/5.0 (Linux; Android 14; Pixel 7) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/141.0.0.0 Mobile Safari/537.36",
          };
          const laptop = { viewport: { width: 1366, height: 800, deviceScaleFactor: 1 } };
          const hasil = [];

          async function cek(nama, url, perangkat, js = true) {
            const page = await browser.newPage();
            await page.setViewport(perangkat.viewport);
            if (perangkat.userAgent) await page.setUserAgent(perangkat.userAgent);
            await page.setJavaScriptEnabled(js);
            const log = [];
            page.on("console", (m) => { if (["error", "warn", "warning"].includes(m.type())) log.push(`console.${m.type()}: ${m.text().slice(0, 300)}`); });
            page.on("pageerror", (e) => log.push(`ERROR JS: ${String(e.message).slice(0, 400)}`));
            page.on("requestfailed", (r) => log.push(`gagal: ${r.url().slice(0, 150)} ${r.failure()?.errorText}`));
            page.on("response", (r) => { if (r.status() >= 400) log.push(`HTTP ${r.status()}: ${r.url().slice(0, 150)}`); });
            let utama = "";
            try {
              const resp = await page.goto(url, { waitUntil: "networkidle2", timeout: 45000 });
              utama = `${resp?.status()} ${resp?.headers()["content-type"]} -> ${page.url()}`;
            } catch (e) {
              utama = `GAGAL MEMBUKA: ${e.message}`;
            }
            await new Promise((r) => setTimeout(r, 3500));
            let info = {};
            try {
              info = await page.evaluate(() => {
                const root = document.getElementById("root");
                const vis = [...document.querySelectorAll("h1, h2")].filter((el) => {
                  const s = getComputedStyle(el);
                  let p = el, o = 1;
                  while (p && p !== document.documentElement) { o *= parseFloat(getComputedStyle(p).opacity || "1"); p = p.parentElement; }
                  const r = el.getBoundingClientRect();
                  return s.visibility !== "hidden" && s.display !== "none" && o > 0.05 && r.width > 0 && r.height > 0;
                }).length;
                return {
                  isiRoot: root ? root.children.length : -1,
                  panjangTeks: document.body.innerText.length,
                  judulTerlihat: vis,
                  judulTotal: document.querySelectorAll("h1, h2").length,
                  awalTeks: document.body.innerText.slice(0, 160).replace(/\s+/g, " "),
                  script: [...document.scripts].map((s) => `${s.type || "classic"} ${s.src ? new URL(s.src).pathname : "inline"}`).slice(0, 12),
                  cdnCgi: [...document.querySelectorAll("script[src*='cdn-cgi']")].map((s) => s.src),
                };
              });
            } catch (e) {
              info = { gagalEvaluate: e.message };
            }
            await page.screenshot({ path: `cek-tampilan/${nama}.jpg`, type: "jpeg", quality: 60 });
            hasil.push({ nama, url, js, utama, info, log: log.slice(0, 25) });
            await page.close();
          }

          await cek("domain-hp", "https://nanangdigital.web.id/", hp);
          await cek("domain-laptop", "https://nanangdigital.web.id/", laptop);
          await cek("domain-hp-tanpa-js", "https://nanangdigital.web.id/", hp, false);
          await cek("http-hp", "http://nanangdigital.web.id/", hp);
          await cek("www-hp", "https://www.nanangdigital.web.id/", hp);
          await cek("workersdev-hp", "https://nanangdigital-for-ac.wong-moghey.workers.dev/", hp);
          await browser.close();
          fs.writeFileSync("cek-tampilan/hasil.json", JSON.stringify(hasil, null, 2));
          console.log(JSON.stringify(hasil, null, 2));
          JS
          node /tmp/pp/cek.mjs

      - name: Simpan hasil ke branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cek-tampilan
          git commit -m "Sementara: hasil cek tampilan nanangdigital.web.id"
          git push
