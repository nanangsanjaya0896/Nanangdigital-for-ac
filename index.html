<!doctype html>
<html lang="id" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Verifikasi Kepemilikan Google Search Console -->
    <meta name="google-site-verification" content="cUtDIR_P8p7d7c7WhBW26zwoCDNGvTZuHAcGcS9X-B0" />
    <meta name="theme-color" content="#0f1115" />
    <meta name="color-scheme" content="dark" />
    <title>NanangDigital | Jasa Website &amp; Iklan Meta Ads Khusus Usaha Service AC</title>
    <meta
      name="description"
      content="Jasa pembuatan website resmi dan setup iklan Facebook &amp; Instagram khusus teknisi maupun bengkel usaha service AC. Paket mulai Rp1.500.000 gratis domain &amp; hosting 1 tahun."
    />
    <link rel="canonical" href="%SITE_URL%/" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <!-- Favicon dari logo ND: SVG untuk browser modern (ikut mode gelap), ICO cadangan untuk Google & browser lama,
         ikon PNG untuk layar utama iPhone dan Android -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph / WhatsApp / Media Sosial -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="id_ID" />
    <meta property="og:site_name" content="NanangDigital" />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:title" content="NanangDigital | Jasa Website &amp; Meta Ads Khusus Usaha Service AC" />
    <meta
      property="og:description"
      content="Biar usaha service AC Anda gampang ditemukan di Google &amp; dipercaya pelanggan. Selesai 3 sampai 5 hari kerja, gratis domain &amp; hosting tahun pertama."
    />
    <meta
      property="og:image"
      content="https://res.cloudinary.com/col2kwnv/image/upload/f_auto,q_auto,w_1200,h_630,c_fill,g_face/photo1"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="NanangDigital | Jasa Website &amp; Meta Ads Khusus Usaha Service AC" />
    <meta
      name="twitter:description"
      content="Website resmi &amp; setup iklan lokal khusus usaha service AC. Paket mulai Rp1.500.000 sudah termasuk domain, hosting, SSL, dan Google Maps."
    />

    <!-- Foto founder dan logo dari Cloudinary: sambungan disiapkan lebih awal. Foto tidak di-preload karena
         sudah ada di HTML hasil prerender (langsung ditemukan browser) dan di HP letaknya di bawah layar pertama. -->
    <link rel="preconnect" href="https://res.cloudinary.com" />

    <!-- Data terstruktur Schema.org (JSON-LD). Versi lengkapnya (Organization, Person, WebSite, layanan +
         paket harga, FAQPage, artikel) dibuat otomatis saat build oleh scripts/prerender.mjs dari
         src/seo/schema.ts, memakai data yang sama dengan isi halaman supaya selalu sinkron.
         Blok kecil di bawah ini hanya dipakai saat Live Preview (npm run dev). -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "@id": "%SITE_URL%/#organization",
        "name": "NanangDigital",
        "url": "%SITE_URL%/"
      }
    </script>

    <!-- Cadangan tampilan: kalau JavaScript tidak jalan, gagal, atau sangat lambat (HP lama, sinyal lemah),
         bagian yang menunggu animasi muncul tetap ditampilkan sehingga halaman tidak terlihat kosong. -->
    <style>
      html {
        background-color: #0d1116;
      }
      .tampil-tanpa-js .reveal,
      .tampil-tanpa-js [style*="opacity:0"] {
        opacity: 1 !important;
        transform: none !important;
      }
    </style>
    <noscript>
      <style>
        .reveal,
        [style*="opacity:0"] {
          opacity: 1 !important;
          transform: none !important;
        }
      </style>
    </noscript>
    <script>
      setTimeout(function () {
        if (!window.__ndSiap) document.documentElement.className += " tampil-tanpa-js";
      }, 3000);
    </script>

    <!-- Google Analytics 4 (G-JY9N81NCQE) + Meta Pixel (2971268586402489) dimuat ringan tanpa menghambat Mobile PageSpeed.
         Antrean gtag() dan fbq() langsung aktif, jadi event yang terjadi sebelum skrip selesai dimuat tetap terkirim. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        window.dataLayer.push(arguments);
      }
      gtag("js", new Date());
      gtag("config", "G-JY9N81NCQE", { send_page_view: true });

      !(function (f, b, e, v, n, t, s) {
        if (f.fbq) return;
        n = f.fbq = function () {
          n.callMethod ? n.callMethod.apply(n, arguments) : n.queue.push(arguments);
        };
        if (!f._fbq) f._fbq = n;
        n.push = n;
        n.loaded = !0;
        n.version = "2.0";
        n.queue = [];
      })(window);
      window.fbq("init", "2971268586402489");
      window.fbq("track", "PageView");

      (function () {
        var analyticsLoaded = false;
        function loadExternalTrackers() {
          if (analyticsLoaded) return;
          analyticsLoaded = true;

          var gaScript = document.createElement("script");
          gaScript.async = true;
          gaScript.src = "https://www.googletagmanager.com/gtag/js?id=G-JY9N81NCQE";
          document.head.appendChild(gaScript);

          var fbScript = document.createElement("script");
          fbScript.async = true;
          fbScript.src = "https://connect.facebook.net/en_US/fbevents.js";
          document.head.appendChild(fbScript);
        }

        // Dimuat begitu pengunjung mulai berinteraksi (sentuh, scroll, klik, ketik, gerak mouse),
        // atau paling lambat 6 detik setelah halaman selesai dimuat. Skrip GA4 dan Pixel cukup berat
        // (sekitar 400 KB), jadi tidak ikut berebut dengan tampilan awal di HP.
        ["pointerdown", "pointermove", "keydown", "scroll", "touchstart", "wheel"].forEach(function (ev) {
          window.addEventListener(ev, loadExternalTrackers, { once: true, passive: true });
        });
        window.addEventListener("load", function () {
          setTimeout(loadExternalTrackers, 6000);
        });
      })();
    </script>
  </head>
  <body class="bg-ink text-white antialiased">
    <noscript>
      <img
        height="1"
        width="1"
        style="display: none"
        alt=""
        src="https://www.facebook.com/tr?id=2971268586402489&amp;ev=PageView&amp;noscript=1"
      />
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
