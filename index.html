    <!-- Cadangan tampilan: kalau JavaScript tidak jalan, gagal, atau sangat lambat (HP lama, sinyal lemah),
         bagian yang menunggu animasi muncul tetap ditampilkan sehingga halaman tidak terlihat kosong. -->
    <style>
      html {
        background-color: #0d1116;
      }
      .tampil-tanpa-js .reveal,
      .tampil-tanpa-js [style*="opacity:0"] {
        opacity: 1 !important;
        transform: none !important;
      }
    </style>
    <noscript>
      <style>
        .reveal,
        [style*="opacity:0"] {
          opacity: 1 !important;
          transform: none !important;
        }
      </style>
    </noscript>
    <script>
      setTimeout(function () {
        if (!window.__ndSiap) document.documentElement.className += " tampil-tanpa-js";
      }, 3000);
    </script>

    <!-- Google Analytics 4 (G-JY9N81NCQE) + Meta Pixel (2971268586402489) dimuat ringan tanpa menghambat Mobile PageSpeed.
         Antrean gtag() dan fbq() langsung aktif, jadi event yang terjadi sebelum skrip selesai dimuat tetap terkirim. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        window.dataLayer.push(arguments);
      }
      gtag("js", new Date());
      gtag("config", "G-JY9N81NCQE", { send_page_view: true });

      !(function (f, b, e, v, n, t, s) {
        if (f.fbq) return;
        n = f.fbq = function () {
          n.callMethod ? n.callMethod.apply(n, arguments) : n.queue.push(arguments);
        };
        if (!f._fbq) f._fbq = n;
        n.push = n;
        n.loaded = !0;
        n.version = "2.0";
        n.queue = [];
      })(window);
      window.fbq("init", "2971268586402489");
      window.fbq("track", "PageView");

      (function () {
        var analyticsLoaded = false;
        function loadExternalTrackers() {
          if (analyticsLoaded) return;
          analyticsLoaded = true;

          var gaScript = document.createElement("script");
          gaScript.async = true;
          gaScript.src = "https://www.googletagmanager.com/gtag/js?id=G-JY9N81NCQE";
          document.head.appendChild(gaScript);

          var fbScript = document.createElement("script");
          fbScript.async = true;
          fbScript.src = "https://connect.facebook.net/en_US/fbevents.js";
          document.head.appendChild(fbScript);
        }

        // Dimuat begitu pengunjung mulai berinteraksi (sentuh, scroll, klik, ketik, gerak mouse),
        // atau paling lambat 6 detik setelah halaman selesai dimuat. Skrip GA4 dan Pixel cukup berat
        // (sekitar 400 KB), jadi tidak ikut berebut dengan tampilan awal di HP.
        ["pointerdown", "pointermove", "keydown", "scroll", "touchstart", "wheel"].forEach(function (ev) {
          window.addEventListener(ev, loadExternalTrackers, { once: true, passive: true });
        });
        window.addEventListener("load", function () {
          setTimeout(loadExternalTrackers, 6000);
        });
      })();
    </script>
